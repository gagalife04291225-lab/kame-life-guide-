<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カメふしぎ島 TikTok 25秒｜KAME LIFE GUIDE</title>
<!-- フォントは同梱（fetch-fonts.mjs が生成）。
     書き出し用の Chromium は外部ネットワークに出られないため、
     Google Fonts を実行時に読み込ませてはいけない。 -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ============================================================
     カメふしぎ島 TikTok 動画（9:16 / 1080x1920 / 25秒 / 30fps）
     - CSS アニメーションは使わない。全フレームを JS の applyFrame(t)
       で決定的に描くため、Playwright から1コマずつ正確にシークできる。
     ============================================================ */
  :root{
    --forest-deep:#0d1f1a;
    --forest:#2f4a3c;
    --parchment:#f4efe2;
    --accent:#d4a96a;
    --k-yellow:#e8a33d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;overflow:hidden}
  body{display:grid;place-items:center;min-height:100vh}

  #stage{
    position:relative;
    width:1080px;height:1920px;
    overflow:hidden;
    background:var(--forest-deep);
    transform-origin:top left;
  }

  /* ---------- 映像レイヤー ---------- */
  .cut{
    position:absolute;inset:0;
    opacity:0;
    will-change:opacity;
  }
  .cut .frame{
    position:absolute;inset:0;
    will-change:transform;
    transform-origin:center center;
  }
  .cut img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  /* 写真が未配置のときのプレースホルダー */
  .cut .ph{
    position:absolute;inset:0;
    display:none;
    place-content:start center;justify-items:center;align-content:start;
    background:
      radial-gradient(120% 90% at 30% 20%, #3f6a52 0%, #22402f 55%, #0d1f1a 100%);
    color:#f4efe2;
    font-family:"Noto Sans JP",sans-serif;
    text-align:center;
    padding:120px 80px;
  }
  .cut.missing .ph{display:grid}
  .cut.missing img{visibility:hidden}
  .ph b{display:block;font-size:44px;letter-spacing:.04em;margin-bottom:24px;color:var(--accent)}
  .ph span{display:block;font-size:34px;line-height:1.7;opacity:.85}

  /* ---------- グレーディング（可読性確保） ---------- */
  #grade{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(13,31,26,.55) 0%, rgba(13,31,26,0) 26%),
      linear-gradient(to top,   rgba(13,31,26,.62) 0%, rgba(13,31,26,0) 34%);
  }
  #scrim{position:absolute;inset:0;pointer-events:none;background:var(--forest-deep);opacity:0}

  /* ---------- テロップ ----------
     参考動画（既存のカメライフガイド版）に合わせた形式。
     1行＝1枚の濃緑プレート。プレート下端に金のアンダーライン。
     強調語だけ金。プレート地で可読性を確保するので白フチは使わない。
     色は参考動画からの実測（プレート #0e1811 前後 / 金 #d4a96a）。 */
  #captions{position:absolute;inset:0;pointer-events:none}
  .cap{
    position:absolute;
    /* セーフエリアは tiktok/DESIGN-SYSTEM.md v1.0 の保守値 x:86〜950 / y:288〜1382 */
    left:86px;
    display:flex;flex-direction:column;align-items:flex-start;gap:14px;
    opacity:0;
    will-change:opacity,transform;
  }
  .plate{
    position:relative;
    background:rgba(13,22,17,.88);
    border-radius:18px;
    padding:14px 34px 20px;
    font-family:"Noto Sans JP",sans-serif;
    font-weight:900;
    color:#fff;
    line-height:1.25;
    letter-spacing:.01em;
    white-space:pre;           /* 自動折り返しは禁止。改行は \n だけで制御する */
    box-shadow:0 8px 28px rgba(0,0,0,.34);
  }
  .plate::after{               /* 金のアンダーライン */
    content:"";position:absolute;left:20px;right:20px;bottom:8px;
    height:5px;border-radius:3px;background:var(--accent);
  }
  .plate .em{color:var(--accent)}

  /* サイズは「1行の最大文字数 × font-size ＋ 左右パディング68px ≦ 864px」で決めている。
     文言を長くするときは必ずこの計算をやり直すこと。 */
  .cap.xl .plate{font-size:76px}   /* 最長「一緒に調べてみよう。」10字 = 760+68 = 828px */
  .cap.lg .plate{font-size:64px}   /* 最長「学びのきっかけになった。」12字 = 768+68 = 836px */
  .cap.md .plate{font-size:56px}
  .cap.sm .plate{font-size:42px;font-weight:700}

  /* ---------- 左上のブランドチップ ---------- */
  #brandchip{
    position:absolute;left:52px;top:70px;
    display:flex;align-items:center;gap:16px;
    background:rgba(13,22,17,.80);
    border:3px solid rgba(212,169,106,.85);
    border-radius:999px;
    padding:12px 30px 12px 14px;
    font-family:"Noto Sans JP",sans-serif;
    font-weight:700;font-size:34px;color:var(--parchment);
    letter-spacing:.04em;
  }
  #brandchip .dot{
    width:46px;height:46px;border-radius:50%;
    background:var(--accent);
    display:grid;place-items:center;font-size:26px;line-height:1;
  }

  /* ---------- 上端のプログレスバー ---------- */
  #progress{
    position:absolute;left:0;top:0;height:12px;
    background:var(--accent);width:0;
  }

  /* ---------- エンドカード ---------- */
  #endcard{
    position:absolute;left:0;right:0;top:0;bottom:0;
    display:grid;place-content:center;justify-items:center;
    gap:26px;text-align:center;opacity:0;
    font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;
    padding-bottom:180px;
  }
  /* 入口の写真は空と海が明るいので、文字の下に必ず暗い面を敷いて
     コントラストを固定する（#f4efe2 on #12241e = 14.1:1）。
     #endcard の擬似要素に z-index:-1 で置くと、積層文脈の都合で
     写真より後ろに回って効かなくなる。独立した要素として
     #endcard の直前に置き、不透明度を同じ値で動かす。 */
  /* radial-gradient は実効アルファが指定どおりに出ず（実測で 0.63 指定に対し
     約 0.12 しか乗らなかった）、暗面がほぼ効いていなかった。確実に効く単色にする。
     0.72 は「実際の書き出しから地の色を実測し、文字が乗る帯の最悪点で
     #f4efe2 が 7.39:1（AAA）を保つ」ことから決めた値（.68 では 6.80:1 で AAA に届かなかった）。 */
  #endscrim{
    position:absolute;inset:0;
    background:rgba(13,25,20,.72);
    opacity:0;pointer-events:none;
  }
  #endcard .mark{font-size:150px;line-height:1}
  #endcard .title{
    font-size:112px;font-weight:800;color:#fff;letter-spacing:.02em;
    -webkit-text-stroke:10px var(--forest-deep);paint-order:stroke fill;
    text-shadow:0 6px 24px rgba(13,31,26,.8);
  }
  #endcard .rule{width:220px;height:6px;background:var(--accent);border-radius:3px}
  #endcard .sub{
    font-family:"Noto Sans JP",sans-serif;
    font-size:38px;font-weight:700;color:var(--parchment);
    letter-spacing:.22em;
    text-shadow:0 3px 14px rgba(13,31,26,.9);
  }
  /* CTA。TikTok でタップできるのはプロフィールのウェブサイト欄だけで、
     動画内の文字・キャプション・コメントの URL はすべてタップできない。
     そのウェブサイト欄が使えるかはアカウント種別によるが、本リポジトリからは
     確認できない（未確認）。「プロフィールのリンクから」は欄が無い場合に
     嘘になるため、常に真である「検索」を採用している。
     ウェブサイト欄が使えることを確認できたら、下の文言を
     「プロフィールのリンクから 👆」に戻すと GA4 で流入を計測できる。
     根拠: ../red-eared-slider-family-video-evaluation.md の監査結果。 */
  #endcard .cta{
    font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;
    font-size:44px;font-weight:800;color:var(--forest-deep);
    background:var(--accent);border-radius:999px;padding:20px 46px;
    letter-spacing:.02em;white-space:nowrap;
  }

  /* ---------- プレビュー用（?play=1）---------- */
  #hud{
    position:fixed;left:12px;bottom:12px;z-index:99;
    font:600 13px/1.4 ui-monospace,monospace;color:#9fe3bd;
    background:rgba(0,0,0,.6);padding:6px 10px;border-radius:6px;display:none;
  }
  body.preview #hud{display:block}
</style>
</head>
<body>

<div id="stage"></div>
<div id="hud"></div>

<script>
/* ================================================================
   タイムライン定義 — テロップ文言・尺・素材はすべてここだけを触る
   t は秒。DURATION = 25.0s
   ================================================================ */
const DURATION = 25.0;

/* 写真素材（photos/ に配置）。未配置のカットは自動でプレースホルダー表示。 */
const CUTS = [
  /* --- 0〜3.4秒／同じ写真を3カットに割る ---
     絵コンテの「透明ケースのカメを大きく見せる」を保ったまま、
     冒頭3秒のカット数を 0 → 2 にする（DESIGN-SYSTEM Y3 の要件）。
     素材は 1023×1537 でカバー後 1278px 相当あるため、寄り引きだけで
     追加素材なしに3つの画角が作れる。3カットともハードカット（xfade 0）。 */
  {
    id: 'c1a', start: 0.0, end: 1.05, xfade: 0,
    src: 'photos/01-turtle-case.jpg',
    note: '0〜1.05秒／カメだけに寄る（origin はカバー切り抜き後のカメの位置・実測）',
    focus: '50% 50%', origin: '72% 84%', zoom: [2.30, 2.10],
    captions: [
      /* 動画全体のフック。9字行の上限は (864-68)/9 = 88.4px なので 88px まで使い切る。
         下端 = 1070 + (88×1.25+34)×2 + 14 = 1372px でセーフエリア内。
         at/inDur を詰めて不透明度100%到達を 0.77秒 → 0.26秒 にする。 */
      { text: '息子が[[カメ]]を\n連れて帰ってきた。', cls: 'xl', size: 88,
        top: 1044, at: 0.10, inDur: 0.16, out: 3.4 }
    ]
  },
  {
    id: 'c1b', start: 1.05, end: 2.05, xfade: 0,
    src: 'photos/01-turtle-case.jpg',
    note: '1.05〜2.05秒／息子の顔へ寄る',
    focus: '50% 50%', origin: '62% 40%', zoom: [1.70, 1.60],
    captions: []
  },
  {
    id: 'c1c', start: 2.05, end: 3.4, xfade: 0,
    src: 'photos/01-turtle-case.jpg',
    note: '2.05〜3.4秒／引いて親子とケースを入れる',
    focus: '50% 50%', origin: '50% 50%', zoom: [1.32, 1.22],
    captions: []
  },
  {
    id: 'c2a', start: 3.2, end: 5.30,
    src: 'photos/02-parent-child-phone.jpg',
    note: '3.2〜5.3秒／親子でスマホをのぞく',
    focus: '50% 38%', zoom: [1.06, 1.11],
    captions: [
      { text: '何を食べる？',            cls: 'lg', top: 300, at: 3.55, out: 7.3 },
      { text: 'どんな場所で暮らす？',     cls: 'lg', top: 434, at: 4.55, out: 7.3 },
      { text: 'そもそも[[何ガメ]]？',     cls: 'lg', top: 568, at: 5.55, out: 7.3 }
    ]
  },
  {
    id: 'c2b', start: 5.30, end: 7.3, xfade: 0,
    src: 'photos/02-parent-child-phone.jpg',
    note: '5.3〜7.3秒／スマホの手元へ寄る（同じ写真のパンチイン）',
    focus: '50% 38%', origin: '30% 62%', zoom: [1.24, 1.18],
    captions: []
  },
  {
    id: 'c3a', start: 7.1, end: 9.20,
    src: 'photos/03-searching.jpg',
    note: '7.1〜9.2秒／検索している雰囲気',
    focus: '46% 46%', zoom: [1.14, 1.06],
    captions: [
      { text: 'でも、せっかくなら——',   cls: 'lg', top: 1180, at: 7.35, out: 9.15 }
    ]
  },
  {
    id: 'c3b', start: 9.20, end: 11.3, xfade: 0,
    src: 'photos/03-searching.jpg',
    note: '9.2〜11.3秒／二人の表情へ寄る。テロップが替わる 9.25 と同じ位置で画も切る',
    focus: '46% 46%', origin: '52% 38%', zoom: [1.26, 1.14],
    captions: [
      { text: '一緒に[[調べてみよう。]]', cls: 'xl', top: 1160, at: 9.25, out: 11.3 }
    ]
  },

  /* --- 11.1〜17.3秒／「一緒に」の4カット ---
     もとは assets/kids/ の島のイラスト4枚だったが、親子の写真の流れの中に
     突然イラストが挟まって何を見せられているのか分からない、という指摘を受けて
     全部を親子写真に差し替えた。同じ5枚を寄り先を変えて使い回している。
     顔 → スマホ → カメ → 顔 の順で、見る対象が変わっていくようにした。 */
  {
    id: 'c4a', start: 11.10, end: 12.75,
    src: 'photos/03-searching.jpg',
    note: '11.1〜12.75秒／二人の顔に寄る（一緒に 見る）',
    focus: '50% 40%', origin: '50% 34%', zoom: [1.55, 1.45],
    captions: [ { text: '一緒に [[見る]] 👀', cls: 'lg', top: 1240, at: 11.35, out: 12.75 } ]
  },
  {
    id: 'c4b', start: 12.60, end: 14.25, xfade: 0,
    src: 'photos/02-parent-child-phone.jpg',
    note: '12.6〜14.25秒／スマホの手元に寄る（一緒に 探す）',
    focus: '50% 38%', origin: '30% 66%', zoom: [1.85, 1.70],
    captions: [ { text: '一緒に [[探す]] 🔍', cls: 'lg', top: 1240, at: 12.85, out: 14.25 } ]
  },
  {
    id: 'c4c', start: 14.10, end: 15.75, xfade: 0,
    src: 'photos/01-turtle-case.jpg',
    note: '14.1〜15.75秒／ケースのカメに寄る（一緒に くらべる）',
    focus: '50% 50%', origin: '72% 84%', zoom: [2.05, 1.90],
    captions: [ { text: '一緒に [[くらべる]] 🐢', cls: 'lg', top: 1240, at: 14.35, out: 15.75 } ]
  },
  {
    id: 'c4d', start: 15.60, end: 17.30, xfade: 0,
    src: 'photos/04-alt-smile.jpg',
    note: '15.6〜17.3秒／二人の顔（一緒に 考える）',
    focus: '50% 40%', origin: '52% 38%', zoom: [1.50, 1.38],
    captions: [ { text: '一緒に [[考える]] 💡', cls: 'lg', top: 1240, at: 15.85, out: 17.3 } ]
  },
  {
    id: 'c5a', start: 17.1, end: 18.90,
    src: 'photos/05-family-smile.jpg',
    note: '17.1〜18.9秒／親子が笑顔',
    focus: '50% 40%', zoom: [1.04, 1.10],
    captions: [
      { text: '拾ってきたカメが、\n[[学びのきっかけ]]になった。', cls: 'lg', top: 1104, at: 17.5, out: 22.2 }
    ]
  },
  {
    id: 'c5b', start: 18.90, end: 20.55, xfade: 0,
    src: 'photos/04-alt-smile.jpg',
    note: '18.9〜20.55秒／別アングル（予備として置いていた写真を投入）',
    focus: '50% 40%', zoom: [1.12, 1.05],
    captions: []
  },
  {
    id: 'c5c', start: 20.55, end: 22.2, xfade: 0,
    src: 'photos/05-family-smile.jpg',
    note: '20.55〜22.2秒／表情へ寄って締める',
    focus: '50% 40%', origin: '58% 44%', zoom: [1.10, 1.20],
    captions: []
  },
  {
    id: 'c6', start: 22.0, end: 25.0,
    src: '../../../../assets/kids/bg-island-entry.webp',
    note: '22〜25秒／カメふしぎ島の入口（エンドカード）',
    focus: '50% 50%', zoom: [1.14, 1.05],
    captions: []
  }
];

/* カット間クロスディゾルブ。
   0.32秒は長すぎて、無関係な絵どうしが二重露光で重なる汚れたコマが出ていた
   （母子の顔が3人分に見える／リクガメが顔に焼き込まれる等）。
   場面転換は3フレーム相当の 0.10 秒。同じ写真の中での寄り引きは
   カットごとに xfade: 0 を指定して完全なハードカットにする。 */
const XFADE = 0.10;
const ENDCARD_AT = 22.25;  // エンドカード出現

/* ================================================================
   ビルド
   ================================================================ */
const stage = document.getElementById('stage');
const nodes = [];

for (const cut of CUTS) {
  const el = document.createElement('div');
  el.className = 'cut';
  el.id = cut.id;

  const frame = document.createElement('div');
  frame.className = 'frame';
  // ズームの基準点。scale() は要素の中心を基準に拡大するため、
  // object-position（focus）だけでは寄り先を指定できない。
  frame.style.transformOrigin = cut.origin || 'center center';

  const img = document.createElement('img');
  img.src = cut.src;
  img.alt = '';
  img.style.objectPosition = cut.focus;
  img.addEventListener('error', () => el.classList.add('missing'));

  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.innerHTML = '<b>PHOTO 未配置</b><span>' + cut.note + '<br>' + cut.src + '</span>';

  frame.appendChild(img);
  frame.appendChild(ph);
  el.appendChild(frame);
  stage.appendChild(el);

  nodes.push({ cut, el, frame });
}

const grade = document.createElement('div');
grade.id = 'grade';
stage.appendChild(grade);

const capLayer = document.createElement('div');
capLayer.id = 'captions';
stage.appendChild(capLayer);

/** 文言を1行ずつプレートに割る。[[…]] で囲んだ部分は金の強調になる。 */
function buildPlates(text) {
  return text.split('\n').map(line => {
    const plate = document.createElement('div');
    plate.className = 'plate';
    for (const part of line.split(/(\[\[[^\]]*\]\])/)) {
      if (!part) continue;
      if (part.startsWith('[[')) {
        const em = document.createElement('span');
        em.className = 'em';
        em.textContent = part.slice(2, -2);
        plate.appendChild(em);
      } else {
        plate.appendChild(document.createTextNode(part));
      }
    }
    return plate;
  });
}

const capNodes = [];
for (const cut of CUTS) {
  for (const c of cut.captions) {
    const el = document.createElement('div');
    el.className = 'cap ' + (c.cls || 'md');
    for (const plate of buildPlates(c.text)) {
      // size を指定するとクラスの既定サイズを上書きできる。
      // 「1行の最大文字数 × size + 68 ≦ 864」を必ず自分で確かめること。
      if (c.size) plate.style.fontSize = c.size + 'px';
      el.appendChild(plate);
    }
    el.style.top = c.top + 'px';
    if (c.left != null) el.style.left = c.left + 'px';
    capLayer.appendChild(el);
    capNodes.push({ c, el });
  }
}

const brandchip = document.createElement('div');
brandchip.id = 'brandchip';
brandchip.innerHTML = '<span class="dot">🐢</span>カメライフガイド';
stage.appendChild(brandchip);

const progress = document.createElement('div');
progress.id = 'progress';
stage.appendChild(progress);

const endscrim = document.createElement('div');
endscrim.id = 'endscrim';
stage.appendChild(endscrim);

const endcard = document.createElement('div');
endcard.id = 'endcard';
endcard.innerHTML =
  '<div class="mark">🐢</div>' +
  '<div class="title">カメふしぎ島</div>' +
  '<div class="rule"></div>' +
  '<div class="sub">KAME LIFE GUIDE</div>' +
  '<div class="cta">「カメライフガイド」で けんさく</div>';
stage.appendChild(endcard);

const scrim = document.createElement('div');
scrim.id = 'scrim';
stage.appendChild(scrim);

/* ================================================================
   フレーム描画
   ================================================================ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const lerp = (a, b, p) => a + (b - a) * p;

/** カットの不透明度：イン/アウトをクロスさせる。
 *  cut.xfade で1カットずつ上書きでき、0 ならハードカット。 */
function cutOpacity(cut, t) {
  const xf = cut.xfade != null ? cut.xfade : XFADE;
  if (t >= cut.end || t <= cut.start - xf) return 0;
  if (xf <= 0) return t >= cut.start ? 1 : 0;
  let o = 1;
  if (t < cut.start) o = Math.min(o, (t - (cut.start - xf)) / xf);
  if (t > cut.end - xf) o = Math.min(o, (cut.end - t) / xf);
  return clamp(o, 0, 1);
}

function applyFrame(t) {
  t = clamp(t, 0, DURATION);

  for (const { cut, el, frame } of nodes) {
    const o = cutOpacity(cut, t);
    el.style.opacity = o.toFixed(4);
    if (o > 0) {
      const p = clamp((t - cut.start) / (cut.end - cut.start), 0, 1);
      const s = lerp(cut.zoom[0], cut.zoom[1], p);
      frame.style.transform = 'scale(' + s.toFixed(4) + ')';
    }
  }

  for (const { c, el } of capNodes) {
    // 立ち上がりは既定 0.24 秒。冒頭フックだけ inDur でさらに詰めている
    // （0.42秒だと不透明度100%到達が 0.77秒になり、離脱判定の最も厳しい
    //   帯で文字が読めない状態になっていた）。
    const IN = c.inDur != null ? c.inDur : 0.24, OUT = 0.26;
    let o = 0, dy = 26;
    if (t >= c.at && t <= c.out) {
      const pi = clamp((t - c.at) / IN, 0, 1);
      const e = easeOutCubic(pi);
      o = e;
      dy = lerp(26, 0, e);
      if (t > c.out - OUT) o = Math.min(o, (c.out - t) / OUT);
    }
    el.style.opacity = clamp(o, 0, 1).toFixed(4);
    el.style.transform = 'translateY(' + dy.toFixed(2) + 'px)';
  }

  // 上端のプログレスバー
  progress.style.width = (t / DURATION * 1080).toFixed(1) + 'px';

  // エンドカード（出たらブランドチップは引っ込める。二重表示になるため）
  brandchip.style.opacity = (t < ENDCARD_AT - 0.2 ? 1 : 0).toFixed(2);

  const ep = clamp((t - ENDCARD_AT) / 0.55, 0, 1);
  const ee = easeOutCubic(ep);
  endscrim.style.opacity = ee.toFixed(4);
  endcard.style.opacity = ee.toFixed(4);
  endcard.style.transform = 'translateY(' + lerp(30, 0, ee).toFixed(2) + 'px) scale(' + lerp(0.96, 1, ee).toFixed(4) + ')';

  // 最後の 0.25 秒でわずかに沈める（ループ耐性）
  scrim.style.opacity = (t > DURATION - 0.25 ? (t - (DURATION - 0.25)) / 0.25 * 0.35 : 0).toFixed(4);
}

window.__seek = applyFrame;
window.__duration = DURATION;
applyFrame(0);

/* ---------------- プレビュー再生（?play=1） ---------------- */
const params = new URLSearchParams(location.search);
if (params.get('play') === '1') {
  document.body.classList.add('preview');
  const hud = document.getElementById('hud');
  // 画面に収める
  const fit = () => {
    const k = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    stage.style.transform = 'scale(' + k + ')';
    stage.style.position = 'absolute';
    stage.style.left = ((window.innerWidth - 1080 * k) / 2) + 'px';
    stage.style.top = ((window.innerHeight - 1920 * k) / 2) + 'px';
  };
  fit(); window.addEventListener('resize', fit);

  let t0 = performance.now();
  const tick = now => {
    const t = ((now - t0) / 1000) % DURATION;
    applyFrame(t);
    hud.textContent = t.toFixed(2) + 's / ' + DURATION.toFixed(2) + 's';
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
