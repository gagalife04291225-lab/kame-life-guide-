name: HF I2V Scout (temporary)

# 音声なしで「画像から動き・表情を作る」用途の Space を洗い出す。
# 前回の調査は音声駆動（talking head）に寄せていたため、
# image-to-video と表情エディタ系の検索語で取り直す。
# 検索するだけ。モデルの導入も実行もしない。

on:
  push:
    branches:
      - claude/mina-talk-test
    paths:
      - '.github/workflows/hf-i2v-scout.yml'

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Query HuggingFace Spaces API
        run: |
          set -uo pipefail
          QUERIES=(
            "image to video" "img2vid" "i2v" "photo to video" "animate image"
            "image animation" "video generation" "first frame video"
            "wan 2.2" "wan2.2" "wan image to video" "ltx video" "ltx"
            "stable video diffusion" "svd" "cogvideox" "hunyuan video"
            "framepack" "seedance" "kling" "veo" "animatediff"
            "expression editor" "liveportrait" "face animation"
            "portrait video" "motion transfer" "pose transfer"
          )
          : > /tmp/all.jsonl
          for q in "${QUERIES[@]}"; do
            enc=$(printf '%s' "$q" | jq -sRr @uri)
            printf '%-26s' "$q"
            n=$(curl -sf --retry 2 \
              "https://huggingface.co/api/spaces?search=${enc}&sort=likes&direction=-1&limit=40&expand[]=runtime&expand[]=likes&expand[]=sdk&expand[]=lastModified" \
              | tee /tmp/one.json | jq 'length') || { echo " (failed)"; continue; }
            jq -c --arg q "$q" '.[] | {
                q: $q, id: .id, likes: (.likes // 0),
                stage: (.runtime.stage // "UNKNOWN"),
                hw: (.runtime.hardware.current // .runtime.hardware.requested // "unknown"),
                sdk: (.sdk // "?"),
                mod: (.lastModified // "" | .[0:10])
              }' /tmp/one.json >> /tmp/all.jsonl
            echo " $n"
            sleep 1
          done

          show() {
            jq -s --arg st "$1" --argjson n "$2" \
              'map(select(.stage == $st)) | group_by(.id) | map(.[0])
               | sort_by(-.likes) | .[0:$n] | .[]
               | "\(.likes|tostring|(" "*(6-length))+.)  hw=\(.hw|.[0:12])  sdk=\(.sdk|.[0:8])  upd=\(.mod)  \(.id)"' -r /tmp/all.jsonl
          }

          echo
          echo "############ RUNNING（いま使える・いいね順 上位60）############"
          show RUNNING 60
          echo
          echo "############ SLEEPING（起こせば動く・上位20）############"
          show SLEEPING 20
          echo
          echo "=== 状態内訳 ==="
          jq -s 'group_by(.id) | map(.[0]) | group_by(.stage)
                 | map({s: .[0].stage, n: length}) | sort_by(-.n) | .[]
                 | "\(.s): \(.n)"' -r /tmp/all.jsonl
          echo "unique spaces: $(jq -s 'group_by(.id)|length' /tmp/all.jsonl)"
