name: ASIN Audit (Mon/Fri)

# 毎週 月曜 と 金曜 の 09:00 JST に、Amazon 商品リンクの「構造監査」を行う。
#
# ■ このワークフローができること（ネットワーク不要・秘密情報不要）
#   - 未検証のまま公開されている ASIN の検出（NEW）
#   - コードから消えた ASIN の検出（REMOVED）
#   - サイト表記が変わり再検証が要る ASIN の検出（RENAMED）
#   - アフィリエイト追跡ID が欠けた Amazon リンクの検出（NO_TAG）
#   - 同一商品名に複数 ASIN を併用している疑い（DUP）
#   - 検証から一定日数が過ぎた ASIN（STALE）
#
# ■ このワークフローに **できないこと**
#   Amazon 上で商品が実在するか、商品名が正しいか、在庫があるかは判定できない。
#   - PA-API は 2026-05-15 に廃止
#   - 後継の Creators API は「直近30日で10件以上の発送実績」が利用条件（未充足）
#   - amazon.co.jp のスクレイピングは規約違反であり BOT 検知もされる
#   したがって **実商品との照合は Claude セッション（WebSearch）側で行う**。
#   本ワークフローはその前段として「何を検証すべきか」を確定させる役割に徹する。

on:
  schedule:
    # UTC 00:00 = JST 09:00。月曜(1)と金曜(5)
    - cron: '0 0 * * 1,5'
  workflow_dispatch:
    inputs:
      stale_days:
        description: '何日を過ぎた検証を STALE 扱いにするか（既定 90）'
        required: false
        default: '90'
      write_csv:
        description: 'docs/asin-audit.csv を現状へ同期してコミットする（検証結果は保持）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: asin-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ASIN 構造監査
        id: audit
        continue-on-error: true
        run: |
          node scripts/audit-asin.mjs \
            --stale-days "${{ github.event.inputs.stale_days || '90' }}" \
            | tee /tmp/asin-report.md

      - name: CSV を現状へ同期（手動実行で write_csv=true のときだけ）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.write_csv == 'true'
        run: |
          node scripts/audit-asin.mjs --write > /dev/null || true
          if [ -n "$(git status --porcelain docs/asin-audit.csv)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/asin-audit.csv
            git commit -m "chore: sync asin-audit.csv [$(date -u +%Y-%m-%d)]"
            git push
          else
            echo "CSV に変更なし"
          fi

      - name: 要対応の差分があれば Issue を立てる／更新する
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/asin-report.md', 'utf8');
            const title = 'ASIN 監査: 要対応の差分があります';
            const marker = '<!-- asin-audit -->';
            const body = [
              marker,
              report,
              '',
              '---',
              '### 次にやること',
              '',
              'この Issue は **構造監査**の結果です。Amazon 上の実商品と一致しているかは',
              'まだ判定していません。実照合は Claude セッションで次を実行してください。',
              '',
              '```',
              'docs/asin-audit.csv の 検証状態 が NOT EVALUATED / CAUTION の ASIN を',
              'WebSearch で amazon.co.jp/dp/<ASIN> と照合し、サイト表記と実商品名の',
              '食い違いを修正して PR を作成する。',
              'ASIN 差し替えを伴うものは merge せず Owner 判断へ戻す。',
              '```',
              '',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { owner, repo } = context.repo;
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:body "${marker}"`,
            });
            const existing = found.data.items[0];

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `監査を再実行しました（${new Date().toISOString().slice(0, 10)}）。本文を最新の結果に更新しています。`,
              });
              core.notice(`既存 Issue #${existing.number} を更新しました`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.notice(`Issue #${created.data.number} を作成しました`);
            }

      - name: 差分が無ければ既存 Issue を閉じる
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- asin-audit -->';
            const { owner, repo } = context.repo;
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:body "${marker}"`,
            });
            for (const it of found.data.items) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: it.number,
                body: '構造監査で要対応の差分が無くなったため close します。',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: it.number,
                state: 'closed', state_reason: 'completed',
              });
              core.notice(`Issue #${it.number} を close しました`);
            }
