name: GSC Direct Search Report

on:
  pull_request:
    paths:
      - scripts/gsc_direct_report.py
      - tests/test_gsc_direct_report.py
      - .github/workflows/gsc-direct-report.yml
  workflow_dispatch:
    inputs:
      days:
        description: 'How many finalized days to analyze (1-365)'
        required: false
        default: '90'
        type: string
  schedule:
    # Every Monday 11:00 JST; settled period ends 3 days earlier
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only API dependencies
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2.31,<3'

      - name: Validate Python source syntax
        run: python -m compileall -q scripts/gsc_direct_report.py tests/test_gsc_direct_report.py

      - name: Offline unit tests (safe for pull requests)
        run: python -m unittest discover -s tests -p 'test_gsc_direct_report.py' -v

      - name: Check settings without printing secrets
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: |
          test -n "$GSC_SITE_URL" || { echo "::error::Set repo variable GSC_SITE_URL to the exact Search Console property."; exit 1; }
          test -n "$GSC_SERVICE_ACCOUNT_JSON" || { echo "::error::Set repo secret GSC_SERVICE_ACCOUNT_JSON."; exit 1; }

      - name: Fetch finalized Search Console data (not on pull requests)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_DAYS: ${{ inputs.days || '90' }}
          GSC_LAG_DAYS: '3'
          GSC_OUTPUT: ${{ runner.temp }}/gsc-private-report.json
          GSC_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GSC_ALLOW_PUBLIC_SUMMARY: ${{ vars.GSC_ALLOW_PUBLIC_SUMMARY }}
        run: python scripts/gsc_direct_report.py

      # No query data uploaded from a public repository.
      - name: Upload report (private repositories only)
        if: ${{ github.event_name != 'pull_request' && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: gsc-private-report
          path: ${{ runner.temp }}/gsc-private-report.json
          if-no-files-found: error
          retention-days: 7
