name: TITAN OSS Watch

# 動画解析まわりの新しいOSSを監視し、候補が出たら Issue で通知する。
# 追加課金なし（GitHub Actions の無料枠 + 標準の GITHUB_TOKEN のみ）。
# LLM API は呼ばない。評価は実測値だけを使う決定的なスコアリング。

on:
  schedule:
    - cron: "0 0 * * 1"        # 毎週月曜 09:00 JST（= 00:00 UTC）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 新規OSS候補を検出して評価する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.parse, datetime
          sys.path.insert(0, "tiktok/video_intel")
          from oss import rank as R

          TOPICS = ["video-processing", "scene-detection", "ocr", "speech-recognition",
                    "subtitles", "pose-estimation", "object-detection", "face-recognition",
                    "audio-analysis", "vector-database", "mcp-server", "ai-agents"]
          MIN_STARS = 500
          known = {r["full_name"] for r in R.load()["repos"]}

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "titan-oss-watch"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # 直近90日に作成された新しいリポジトリだけを見る
          since = (datetime.date.today() - datetime.timedelta(days=90)).isoformat()
          found = []
          for t in TOPICS:
              q = "topic:%s stars:>%d created:>%s" % (t, MIN_STARS, since)
              url = "https://api.github.com/search/repositories?q=%s&sort=stars&per_page=10" % \
                    urllib.parse.quote(q)
              try:
                  data = api(url)
              except Exception as e:
                  print("skip %s: %s" % (t, e)); continue
              for it in data.get("items", []):
                  if it["full_name"] in known or it.get("archived"):
                      continue
                  r = dict(full_name=it["full_name"], category=t, stars=it["stargazers_count"],
                           forks=it["forks_count"], issues=it["open_issues_count"],
                           updated=it["updated_at"][:10], created=it["created_at"][:10],
                           lang=it.get("language"), archived=False,
                           license=(it.get("license") or {}).get("key"))
                  sc = R.score_repo(r)
                  cls = R.LICENSE_CLASS.get(r["license"], "unknown")
                  found.append({**r, **sc, "license_class": cls,
                                "license_note": R.LICENSE_NOTE[cls],
                                "url": it["html_url"], "desc": (it.get("description") or "")[:160]})
                  known.add(it["full_name"])

          found.sort(key=lambda x: -x["score"])
          found = found[:15]
          os.makedirs("/tmp/titan", exist_ok=True)
          json.dump(found, open("/tmp/titan/candidates.json", "w"), ensure_ascii=False, indent=2)

          if not found:
              print("新規候補なし"); sys.exit(0)

          lines = ["## TITAN OSS Watch — 新規候補 %d件" % len(found), "",
                   "直近90日に作成され、star %d 以上の未登録リポジトリ。" % MIN_STARS,
                   "スコアは **実測フィールドのみ** で算出（速度・精度は未測定なので含めない）。", "",
                   "| repo | カテゴリ | score | stars | forks | ライセンス | 商用利用 |",
                   "|------|---------|-------|-------|-------|-----------|---------|"]
          for f in found:
              lines.append("| [%s](%s) | %s | %.1f | %d | %d | %s | %s |" % (
                  f["full_name"], f["url"], f["category"], f["score"], f["stars"],
                  f["forks"], f["license"] or "未取得", f["license_note"]))
          warn = [f for f in found if f["license_class"] in ("network-copyleft", "strong-copyleft")]
          if warn:
              lines += ["", "### ★ライセンス注意", ""]
              lines += ["- **%s** (%s): %s" % (f["full_name"], f["license"], f["license_note"]) for f in warn]
          lines += ["", "### 採否の判断手順",
                    "1. ライセンスを確認する（AGPL/GPL は WebUI 提供時に要注意）",
                    "2. 既存採用OSSと役割が重複しないか確認する",
                    "3. 重複しないなら小さな検証を1本走らせてから registry.json へ追記する",
                    "4. **推測で採用しない。実測してから決める**", "",
                    "_TITAN OSS Watch により自動生成_"]
          open("/tmp/titan/body.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: 候補があれば Issue を作成する
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s /tmp/titan/body.md ]; then echo "候補なし。Issueは作らない"; exit 0; fi
          TITLE="TITAN OSS Watch: 新規動画解析OSS候補 ($(date +%Y-%m-%d))"
          BODY=$(python3 -c "import json;print(json.dumps(open('/tmp/titan/body.md').read()))")
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{\"title\":\"$TITLE\",\"body\":$BODY,\"labels\":[\"titan\",\"oss-watch\"]}" \
            -o /tmp/titan/issue.json -w "HTTP %{http_code}\n"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-oss-candidates
          path: /tmp/titan/
          if-no-files-found: ignore
