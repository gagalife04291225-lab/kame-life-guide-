name: Site offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only, no secrets, paid runner, network API tests or retained artifacts.
permissions:
  contents: read
concurrency:
  group: site-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    # Do not silently consume paid private-repository minutes if visibility changes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Several regression fixtures compare historical commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/run-offline-checks.py
